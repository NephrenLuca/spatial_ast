# ══════════════════════════════════════════════════════════════════════
# Naive text-conditioned SpatialAST run.
#   design : AST + hierarchical corruption + Mamba-Transformer denoiser
#   input  : text only (no image branch, no ablation)
#   target : 1-2 x A100 (40/80 GB), DDP + bf16
#
# Override any field from the CLI, e.g.:
#   torchrun ... scripts/train.py --config configs/naive_text.yaml \
#       train.per_gpu_batch_size=8 model.use_real_encoder=false
# ══════════════════════════════════════════════════════════════════════

model:
  d_model: 768
  num_blocks: 18
  head_dim: 64
  d_ff: 3072
  cross_attn_heads: 8
  mamba_expand: 2
  dwconv_kernel: 5
  time_embed_dim: 512
  embed_dropout: 0.1

  # text-only conditioning
  use_text: true
  use_image: false
  # Set use_real_encoder=true to use a frozen Flan-T5 encoder (recommended
  # for meaningful text conditioning). Requires the weights at
  # text_encoder_name and the `transformers` package + a T5 tokenizer.
  use_real_encoder: true
  text_encoder_name: model/pretrained/flan-t5-base
  freeze_text_encoder: true

diffusion:
  T: 1000
  max_depth: 5
  tau_scale: 0.9
  beta_scale: 0.1
  # Length-preserving modes only: keeps corrupted/target position alignment
  # required by the position-wise reconstruction loss. (noise/shuffle collapse
  # or reorder spans and need an alignment-aware loss — out of scope here.)
  corruption_modes: [mask, resample]

loss:
  reg_weight: 0.1
  depth_weight_alpha: 0.2
  node_ce_weight: 0.5
  param_ce_weight: 2.0

train:
  run_name: naive_text
  seed: 42
  output_dir: outputs

  train_path: data/processed/train.parquet
  val_path: data/processed/val.parquet
  # JSON mapping {file_id: prompt}. Leave null to train with empty prompts
  # (loop is runnable but text conditioning is meaningless without prompts).
  text_annotations: null
  num_workers: 8
  max_text_len: 64
  cfg_dropout: 0.1

  lr: 1.0e-4
  weight_decay: 0.05
  grad_clip: 1.0
  warmup_steps: 2000
  max_steps: 200000
  # Effective global batch = per_gpu_batch_size * num_gpus * accumulation_steps
  # e.g. 16 * 2 * 4 = 128
  per_gpu_batch_size: 16
  accumulation_steps: 4
  precision: bf16

  log_every: 100
  eval_every: 5000
  save_every: 5000
  keep_last_k: 3
  resume: null

  wandb: false
  wandb_project: spatial-ast
  wandb_group: main

  eval_num_samples: 64
  eval_sample_steps: 20
